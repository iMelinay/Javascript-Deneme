<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var s1,s2,s3,ort;

        //Kullanıcıdan sayıları alma
        s1=Number(prompt("Birinci sayıyı giriniz..."));
        s2=Number(prompt("İkinci sayıyı giriniz..."));
        s3=Number(prompt("Üçüncü sayıyı giriniz..."));

        //Üç sayının ortalamasını alalım
        ort=(s1+s2+s3)/3;

        document.write("<b>Ortalama: "+ort);
    </script>
</body>
</html>
