<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //Değişkenlerimiz
        var sayi, kare;

        //Kulanıcıdan sayı alalım
        sayi=Number(prompt("Bir sayı giriniz..."));

        //Karesini alalım
        kare = sayi * sayi;

        document.write("Girdiğiniz sayının karesi: "+kare);


    </script>
</body>
</html>
