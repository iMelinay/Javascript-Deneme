<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        //Değişkenler
        var r,alan,cevre,pi=3.14;

        //Yarıçapı kullanıcıdan istiyelim
        r=Number(prompt("Yarıçapı giriniz..."));

        //Alan hessabı
        alan=pi*r*r;

        //Çevre hessabı
        cevre=2*pi*r;

        //Sonucu ekrana yazdıralım...
        document.write("<b>Alan: </b>"+alan+"<b> Çevre: </b>"+cevre);

    </script>
</body>
</html>
