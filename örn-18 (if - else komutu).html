<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var deger;
        deger=Number(prompt("Bir değer giriniz: "));
        if(deger >= 20){
           document.write("<b>Değeriniz 20 veya daha yüksek bir sayıdır.</b>");
       } else if (deger < 20){
            document.write("<b>Değeriniz 20'den küçük bir sayıdır.</b>");
       } else {
        document.write("<b>Geçerli bir sayı giriniz</b>");
       }
    </script>
</body>
</html>
