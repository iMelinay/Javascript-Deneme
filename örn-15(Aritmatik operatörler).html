<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        var a = Number(prompt("A:"));
        var b = Number(prompt("B:"));

        var toplam = a + b;
        var cikarma = a - b;
        var carpma = a * b;
        var bolme = a / b;
        var mod = a % b;

        document.write("Toplamı: "+ toplam+ " Çıkarma: "+ cikarma+" Çarpımı: "+ carpma+ " Bölümü: "+ bolme+ " Modu: "+ mod);


    </script>
</body>
</html>
